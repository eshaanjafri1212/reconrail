name: reconrail

services:
  postgres:
    image: postgres:16-alpine
    container_name: reconrail-postgres
    environment:
      POSTGRES_USER: reconrail
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U reconrail -d authdb" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: