name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  auth-service:
    name: auth-service build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reconrail
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: authdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reconrail -d authdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: services/auth-service
        run: ./mvnw -B clean verify

      - name: Build Docker image
        working-directory: services/auth-service
        run: docker build -t reconrail/auth-service:${{ github.sha }} .