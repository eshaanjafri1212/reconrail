spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/authdb
#    username: reconrail
#    password: localdev
    username: ${DB_APP_USER:reconrail_app}
    password: ${DB_APP_PASSWORD:localdev_app}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    user: ${DB_MIGRATION_USER:reconrail}
    password: ${DB_MIGRATION_PASSWORD:localdev}
    placeholders:
      # Substituted into V005 so the app role's password never appears in SQL.
      appDbPassword: ${DB_APP_PASSWORD:localdev_app}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
reconrail:
  jwt:
    issuer: reconrail-auth
    audience: reconrail-api
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    private-key: ${JWT_PRIVATE_KEY:classpath:keys/private.pem}
    public-key: ${JWT_PUBLIC_KEY:classpath:keys/public.pem}
    key-id: reconrail-key-1